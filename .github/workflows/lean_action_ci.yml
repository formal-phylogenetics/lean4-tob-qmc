name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read # Read access to repository contents

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      # Mathlib's compiled files take most of the runner's disk; remove preinstalled toolchains
      # that the build does not use.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: leanprover/lean-action@v1
      # `lake build` builds only the modules of the required libraries that this repository imports;
      # the audit reads all of them.
      - name: Build the libraries that the audit reads
        run: lake build Phylogenetics PhyloNetwork TreeOfBlobs Allman2023 Tinnik
      # The audit sees a module's proofs only through its own `import all` line: every module of
      # TobQmc/ (Basic/, External/ and the paper's library), the paper's Solution in palomar/, and
      # every module of the required libraries Phylogenetics, PhyloNetwork, TreeOfBlobs, Allman2023
      # and Tinnik, but not the Challenge, which holds a copy of the definitions of TobQmc/Defs.lean.
      - name: Check that the audit imports every module of the libraries
        run: >-
          diff <({ find TobQmc -name '*.lean'; cd palomar && find . -name Solution.lean;
          cd ../.lake/packages/Phylogenetics && find Phylogenetics -name '*.lean';
          cd ../PhyloNetwork && find PhyloNetwork -name '*.lean';
          cd ../TreeOfBlobs && find TreeOfBlobs -name '*.lean';
          cd ../Allman2023 && find Allman2023 -name '*.lean';
          cd ../Tinnik && find Tinnik -name '*.lean'; }
          | sed 's#^\./##; s/\.lean$//; s#/#.#g' | sort)
          <(grep -E '^import all (TobQmc|Phylogenetics|PhyloNetwork|TreeOfBlobs|Allman2023|Tinnik)\.' scripts/Audit.lean
          | sed 's/^import all //' | sort)
      # It imports the deprecated modules of TreeOfBlobs too, whose import warns.
      - name: Audit axioms and dependencies
        run: lake env lean -Dlinter.deprecated.module=false scripts/Audit.lean
      # The routes of the paper's proofs (docs/TobQmc/paper_routes.tsv) and the reviewed
      # differences (docs/TobQmc/route_differences.tsv).
      - name: Check that the proofs follow the routes of the paper's proofs
        run: >-
          python3 scripts/route_check.py check docs/TobQmc/paper_routes.tsv
          --accept docs/TobQmc/route_differences.tsv
      # The copy of TobQmc/Defs.lean in palomar/TobQmc/Challenge.lean.
      - name: Check that the Challenge's copy of the shared definitions is current
        run: python3 scripts/sync_challenge_defs.py --check
      - name: Check that the documentation's links to the code are current
        run: python3 scripts/linkify_docs.py --check
      - name: Check the Markdown tables
        run: >-
          python3 scripts/check_md_tables.py README.md
          docs/TobQmc/REPORT.md docs/TobQmc/CREDITS.md TobQmc/Basic/README.md
          TobQmc/External/README.md TobQmc/External/Allman2023/README.md
          TobQmc/External/Tinnik/README.md TobQmc/External/AneEtAl2024/README.md
          TobQmc/External/DinhBanos2025/README.md TobQmc/External/KaneTao2017/README.md
