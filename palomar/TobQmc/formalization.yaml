status:
  scope: >-
    Unconditional: no result of the literature is assumed. Every numbered result of TOB-QMC is
    proved as printed or in a corrected form (Lemmas 1, 2, 3, 4; equations (1)-(3); Theorems 1, 2;
    Corollary 1; the ASTRAL corollary; the correctness of 3-fix-1-alter; the consistency claim of
    §4.3; supplement Lemmas 4, 8). The supplement's Lemma 7 and Theorem 1 are false at level 2, by
    an explicit network (E25); its Lemma 2's converse is false with N|Y the induced subnetwork, as
    it defines it, and holds under the gloss in its proof (E23); the margin of its Lemma 4 is
    vacuous as printed (E22). Also proved, from what the paper says in passing: the T3 option, the
    bipartition search combined with 3-fix-1-alter, the implementation that applies the star test to
    the minimizer only, ASTRAL's dynamic program, exact on its search space, and the counts of
    operations behind its running-time claims. Not formalized: simulations and empirical tables, and
    results of cited sources that no proof here uses. Running times are counts of operations, with
    no machine model. See Section 9 of docs/TobQmc/REPORT.md.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models:
        - "GPT-6 family (exact revision not exposed)"
      framework: "Codex"
      tool_setup: "formalize-math-paper skill; three sub-agents; shared local workspace. Source audit and foundations, no numbered paper result."
      cost:
        wall_time: "about 1 h 54 min, 2026-10-27"
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: "Slash command with the three paper links; statement corrections asked of the user and approved."
    - method: "agent"
      models:
        - "claude-opus-5-5"
      framework: "Claude Code (VS Code extension)"
      tool_setup: "formalize-math-paper skill, repository vltanh/formalize-math-paper, commit e339f64 (the last round's log names no commit); Claude Code 2.1.314; 85 sub-agents, at most 11 at once, up to commit 282215c."
      cost:
        wall_time: "29.14 h elapsed, from 2026-10-31 to commit 282215c on 2026-11-01, including 1.67 h for the round that proved the assumed result, 3.36 h for the round that followed the sources and formalized what the papers say in passing, 8.34 h for the round of the two further papers, and 4.61 h for the round that finished what the papers claim; sub-agent work 76.8 h. The documents after that commit are not counted."
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: "Slash command with the three paper links, continuing from the earlier handoff; later the user asked to match the sources closely, to formalize what the report listed as not formalized, to add Gusfield et al. 2007 and Allman et al. 2023 as primary papers on the library lean4-phylogenetics, and to finish what remained, leaving only empirical claims and wrong statements."
  spend_usd: "not tracked"
  notes: >-
    The user chose the papers and the versions of the first three, agreed to the statement
    corrections of ECToBlob and TOB-QMC, and decided the library's boundary, the layout, the kernels
    and publication. AI systems wrote the code, the statements, the audit and the documents. The
    automation above is for the whole project in lean4-phylo-tree-of-blobs, which until 2026-11-04
    also had Gusfield et al. 2007, since moved to its own repository, lean4-gusfield2007; on
    2026-11-21 each of its four papers moved, with its entry, to a repository of its own. TobQmc/ is
    the library; the audit checks every declaration of this repository and of the libraries it
    requires, all on the standard axioms, and Lean's kernel, NanoDa and con-ron accept the theorems
    of the Challenge (scripts/check_kernels.sh). See docs/TobQmc/CREDITS.md and
    lean4-phylo-tree-of-blobs's docs/CREDITS.md at 05a024a.

fidelity:
  divergences: >-
    Statements corrected (Sections 3, 4 and 6 of docs/TobQmc/REPORT.md): the margin of its
    supplement Lemma 4, vacuous as printed (E22); its Lemma 2, forward direction only, with N|Y the
    induced subnetwork (E23); its Lemma 8 for nontrivial blobs (E26). Library statements omit
    hypotheses that the proofs do not use (Section 5 of the report); the Challenge's statements keep
    them. Readings: Section 6 of the report. False claims found, not formalized as stated: the
    supplement's Lemma 7 and Theorem 1 at level 2 (E25).


    Departures from the paper's proofs, every one with what the paper does, what Lean does and why,
    in Section 7 of the report. Repairing gaps or errors: supplement Lemma 4 (E22, E24), Lemma 4
    (E19), Corollary 1 (E20) and consistency (E21). Not forced, and documented: Lemma 1, Lemma 4 (no
    suppression) and supplement Lemma 8 (a lowest reticulation, not disjoint paths); Huber et al.
    Theorem 5.1's converse (domination, in place of excellent cycles); Kane and Tao's inequality
    (abc) (Gibbs' inequality, in place of compactness and a numerically located root); Ané et al.
    Proposition 12 (conditioning at the arc). No printed argument to follow: ASTRAL's dynamic
    program. Narrower than the source: Dinh and Baños, rooted on a hybrid edge, with pendant and
    hybrid lengths 1 and rho = 0. docs/TobQmc/route_differences.tsv records every difference of
    route.

review:
  status: "agent-reviewed"
  reviewers:
    - "none (no human review)"
  notes: >-
    Independent AI agents reviewed the statements against the sources and compared the formal proofs
    with the papers'; a separate agent checked the findings. The route check, Comparator (Lean's
    kernel and NanoDa) and con-ron (scripts/check_kernels.sh) run locally.

alignment:
  namespace: "TobQmcChallenge"
  statements:
    - source: "TOB-QMC v5, Theorem 1"
      lean: "TobQmcChallenge.theorem1"
      module: "TobQmc.Challenge"
      status: "proved"
      note: >-
        With deterministic K, as printed. The library's TobQmc.astral_corollary is the ASTRAL
        corollary.
    - source: "TOB-QMC v5, Theorem 1, the 'put simply' form"
      lean: "TobQmcChallenge.theorem1_optimal"
      module: "TobQmc.Challenge"
      status: "proved"
      note: "Almost surely, for all large k, every optimal solution refines the tree of blobs."
    - source: "TOB-QMC v5, Theorem 2"
      lean: "TobQmcChallenge.theorem2"
      module: "TobQmc.Challenge"
      status: "proved"
      note: >-
        As printed, B is any refinement; Definition 2's quadripartition is read as the
        multipartition at the edge. The supplement's form without the level-1 hypothesis fails (E25:
        TobQmc.LevelTwo.not_theorem2_without_level_one).
    - source: "TOB-QMC v5, consistency claim of §4.3"
      lean: "TobQmcChallenge.consistency"
      module: "TobQmc.Challenge"
      status: "proved"
      note: >-
        Under the printed assumptions, with TINNiK's star and cut tests (assumption 6a). The
        library's TobQmc.consistencyT3_of_noAnomalous is the T3 option,
        TobQmc.consistency_implementation the implementation with the star test on the minimizer
        only, and TobQmc.LevelTwo.not_supplementTheorem1 the failure of the supplement's Theorem 1
        at level 2 (E25).

